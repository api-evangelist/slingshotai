name: Slingshot AI
description: >-
  Slingshot AI is a mental-health research lab building foundation models for
  psychology. Its flagship product, Ash, is a free consumer application for
  iOS and Android designed specifically for therapy, trained on a large
  behavioral-health dataset using reinforcement-learning techniques. Founded by
  Daniel Cahn and Neil Parikh and backed by Felicis, Forerunner Ventures,
  Radical Ventures and Andreessen Horowitz, the company raised a $93M Series A
  in 2025 after an 18-month beta with roughly 50,000 users. Slingshot AI is a
  consumer product company and, as of this profile, publishes no public
  developer API, SDKs, or API documentation.
